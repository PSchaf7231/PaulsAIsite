<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Madison | Palm Beach Real Estate Pros</title>
<style>
*{box-sizing:border-box}body{background:#f7f4ed;color:#142438;font:16px system-ui;padding:4vw}section{position:fixed;right:12px;bottom:12px;width:min(390px,94vw);height:min(560px,78dvh);display:flex;flex-direction:column;border:1px solid #ac9369;border-radius:12px;overflow:hidden;background:white;box-shadow:0 10px 36px #09172533}button{font:inherit;background:#091725;color:white;border:0;padding:12px;text-align:left;touch-action:none;cursor:move}iframe{width:100%;flex:1;border:0}
</style><h1>Palm Beach Real Estate Pros</h1><p>Move Madison by dragging the navy bar.</p>
<section><button aria-label="Move Madison window. Use arrow keys or drag.">⠿　Madison · Drag to move</button><iframe title="Madison conversation" allow="microphone; autoplay" srcdoc='<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><anam-agent agent-id="cdb09e97-23af-4628-9df7-f8a270fb8265" api-base-url="https://lab.anam.ai"></anam-agent><script src="https://unpkg.com/@anam-ai/agent-widget" async></script>'></iframe></section>
<script>
const panel=document.querySelector('section'), handle=document.querySelector('button');
let offset=null;
function move(x,y){
 panel.style.left=Math.max(0,Math.min(x,innerWidth-panel.offsetWidth))+'px';
 panel.style.top=Math.max(0,Math.min(y,innerHeight-panel.offsetHeight))+'px';
}
handle.onpointerdown=e=>{
 offset=[e.clientX-panel.offsetLeft,e.clientY-panel.offsetTop];
 handle.setPointerCapture(e.pointerId);
};
handle.onpointermove=e=>{if(offset)move(e.clientX-offset[0],e.clientY-offset[1]);};
handle.onlostpointercapture=()=>{offset=null;};
handle.onkeydown=e=>{
 const step={ArrowLeft:[-20,0],ArrowRight:[20,0],ArrowUp:[0,-20],ArrowDown:[0,20]}[e.key];
 if(step){e.preventDefault();move(panel.offsetLeft+step[0],panel.offsetTop+step[1]);}
};
addEventListener('resize',()=>move(panel.offsetLeft,panel.offsetTop));
</script></html>
